<!DOCTYPE html>
<html lang="en">
<head>
    <title>Formulario</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Formulario con todos los tipos de Input</h1>
<form action="/my-handling-form-page" method="post">
  <ul>
    <li>
      <label for="name">Nombre:</label>
      <input type="text" id="name" name="user_name" />
    </li>
    <li>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="user_password" />
    </li>
        <li>
      <label for="age">Edad:</label>
      <input type="number" id="age" name="user_age" />
    </li>
        <li>
      <label for="phone">Teléfono:</label>
      <input type="text" id="phone" name="user_phone" />
    </li>
    <li>
      <label for="website">Sitio web:</label>
      <input type="website" id="website" name="user_website" />
    </li>
    <li>
      <label for="mail">Correo electrónico:</label>
      <input type="email" id="mail" name="user_mail" />
    </li>
        <li>
      <label for="time">Hora:</label>
      <input type="time" id="time" name="user_time" />
    </li>
          <li>
      <label for="color">Color:</label>
      <input type="color" id="color" name="user_color" />
    </li>
    <!-- Nivel de satisfacción (1-10)-->
     <div class = "form-group">
        <label for="satisfaction">Nivel de satisfacción (1-10):</label>
        <input type="range" id="satisfaction" name="user_satisfaction" min="1" max="10">
    </div>
    <div class = "form-group">
        <label for = "fecha-hora">Fecha y hora:</label>
        <input type = "datetime-local" id = "fecha-hora" name = "user_datetime">
    </div>
    <div class = "form-group">
        <label for = "semana-anyo">Semana y año:</label>
        <input type = "week" id = "semana-anyo" name = "semana-anyo" value = "2024-W01">
    </div>
    <div class = "form-group">
        <label for = "actualizaciones">Desea recibir actualizaciones:</label>
        <input type = "checkbox" id = "actualizaciones" name = "user_updates">
    </div>
    <div class = "form-group">
        <label for = "genero">Género:</label>
        <input type = "radio" id = "masculino" name = "user_gender" value = "masculino">
        <label for = "masculino">Masculino</label>
        <input type = "radio" id = "femenino" name = "user_gender" value = "femenino">
        <label for = "femenino">Femenino</label>
    </div>
    <div class = "form-group">
        <label for = "archivo">Subir archivo:</label>
        <input type = "file" id = "archivo" name = "user_file">
    </div>
    <li>
      <label for="msg">Mensaje:</label>
      <textarea id="msg" name="user_message"></textarea>
    </li>
        <li>
      <label for="Date">Fecha:</label>
      <input type="date" id="Date" name="user_date" />
    </li>
  </ul>
  <li class="button">
  <div class = buttons>
    <button type="submit">Enviar</button>
    <button type="reset">Reestablecer</button>
</li>
</form>    
</body>
</html>
